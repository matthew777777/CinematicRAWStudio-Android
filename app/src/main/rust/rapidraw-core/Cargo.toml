[package]
name = "crs-rapidraw-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
gpu = ["dep:wgpu", "dep:half", "dep:image", "dep:rayon", "dep:log", "dep:pollster", "dep:imageproc", "dep:anyhow"]

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = "=0.33.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wgpu = { version = "=29.0.4", default-features = false, features = ["vulkan", "metal", "wgsl", "spirv"], optional = true }
half = { version = "=2.7.1", features = ["bytemuck"], optional = true }
image = { version = "=0.25.10", features = ["png", "jpeg", "tiff"], default-features = false, optional = true }
rayon = { version = "=1.12.0", optional = true }
log = { version = "=0.4.34", optional = true }
anyhow = { version = "=1.0.104", optional = true }
imageproc = { version = "=0.27.0", default-features = false, optional = true }
pollster = { version = "=1.0.1", optional = true }

[profile.release]
panic = "abort"

[[bin]]
name = "render-fixture"
path = "src/bin/render-fixture.rs"
required-features = ["gpu"]
